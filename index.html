<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Calorie Scanner</title>
<meta name="description" content="Scan barcodes, search foods and log calories together as a family.">
<meta name="theme-color" content="#0A0C12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Calories">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: one dark column. A glowing calorie ring is the hero (kcal are units of heat, so the
   ring burns amber → coral → pink and turns red past the limit), dishes scroll sideways,
   meals stack below, and a frosted dock floats at the bottom. Sheets slide up and swipe away. */
:root{
  --bg:#0A0C12; --surface:#131722; --surface-2:#1B2030; --surface-3:#262C40;
  --ink:#F3F4F8; --muted:#8B92A8; --faint:#5F667E; --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.12);
  --flame-1:#FFC147; --flame-2:#FF6A3D; --flame-3:#FF3D7F;
  --accent:#FF7A3D; --accent-ink:#1B0A03;
  --protein:#5CC8FF; --carbs:#FFC24D; --fat:#FF7AC1;
  --over:#FF4D5E; --over-bg:rgba(255,77,94,.13); --ok:#4BE0A0; --laser:#FF4D5E;
  --paper:#FBFAF6; --paper-ink:#0D0D0D;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
  color-scheme:dark;
}
*{box-sizing:border-box;touch-action:manipulation}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--display);font-size:15px;line-height:1.4;font-variant-numeric:tabular-nums;
  -webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));}
html.locked,html.locked body{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--flame-1);outline-offset:2px}
a{color:var(--flame-1)}
p{margin:0}
em{font-style:normal}

/* Ambient glow behind the page; turns red when you're over */
.glow{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.glow::before,.glow::after{content:"";position:absolute;left:-20%;right:-20%;top:-12%;height:75vh;transition:opacity 1s var(--ease)}
.glow::before{background:radial-gradient(55% 50% at 50% 28%, rgba(255,106,61,.24), rgba(255,61,127,.09) 48%, transparent 72%)}
.glow::after{background:radial-gradient(55% 50% at 50% 28%, rgba(255,60,80,.32), rgba(255,60,80,.08) 50%, transparent 72%);opacity:0}
body.is-over .glow::before{opacity:0}
body.is-over .glow::after{opacity:1}

.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding-block:10px calc(132px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}

/* Press feedback everywhere */
.btn,.iconbtn,.chip,.tool,.wd,.navbtn,.add,.hstat,.entry{transition:transform .2s var(--ease),background-color .2s,border-color .2s,opacity .2s,box-shadow .2s}
.btn:active,.iconbtn:active,.chip:active,.tool:active,.wd:active,.navbtn:active,.add:active,button.hstat:active{transform:scale(.94)}
button.entry:active{background:rgba(255,255,255,.05)}

/* Header */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-top:8px}
.hello{font-size:13px;color:var(--muted);font-weight:600}
.day{margin:3px 0 0;font-size:34px;line-height:1;font-weight:900;font-stretch:120%;letter-spacing:-.025em;text-wrap:balance}
.day small{display:block;font-size:13px;font-weight:600;color:var(--muted);font-stretch:100%;letter-spacing:0;margin-top:7px}
.top-r{display:flex;gap:8px;align-items:center;flex:none}
.iconbtn{border:1px solid var(--line-2);background:rgba(255,255,255,.05);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:999px;min-width:42px;height:42px;display:inline-grid;place-items:center;padding:0 12px;color:var(--ink)}
.famchip{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:13px;max-width:150px}
.famchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.install{border:1px solid var(--line-2);background:var(--surface);border-radius:20px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:13px}
.install p{flex:1}
.install svg{color:var(--flame-1)}

/* Hero: the ring */
.hero{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));border:1px solid var(--line);border-radius:30px;padding:16px 14px;display:flex;flex-direction:column;gap:16px}
.ringrow{display:grid;grid-template-columns:44px 1fr 44px;align-items:center}
.navbtn{width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;padding:0}
.navbtn:disabled{opacity:.2;cursor:default}
.ringbox{position:relative;width:min(230px,60vw);aspect-ratio:1;max-width:100%;justify-self:center}
.ring{display:block;width:100%;height:100%;transform:rotate(-90deg);overflow:visible;filter:drop-shadow(0 0 14px rgba(255,106,61,.35))}
.ring circle{fill:none;stroke-width:15;stroke-linecap:round}
.ring .track{stroke:rgba(255,255,255,.07)}
.ring .prog{stroke:url(#flame);transition:stroke-dashoffset 1.2s var(--ease),opacity .4s}
.ring .overp{stroke:var(--over);transition:stroke-dashoffset 1.2s var(--ease),opacity .4s}
.hero.over .ring{filter:drop-shadow(0 0 16px rgba(255,77,94,.55))}
.hero.over .ring .prog{opacity:.3}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.ring-c .big{font-size:60px;line-height:.9;font-weight:900;font-stretch:76%;letter-spacing:-.02em}
.ring-c .lbl{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.16em;color:var(--muted);margin-top:8px}
.hero.over .ring-c .big,.hero.over .ring-c .lbl{color:var(--over)}
.hero.over .ringbox{animation:throb 2.6s ease-in-out infinite}
@keyframes throb{50%{transform:scale(1.02)}}
.overmsg{background:var(--over-bg);color:var(--over);border:1px solid rgba(255,77,94,.3);border-radius:16px;padding:10px 12px;font-weight:750;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;animation:pop .6s var(--ease)}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.hstats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hstat{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:18px;padding:10px 14px;text-align:left;display:flex;flex-direction:column;gap:1px;color:var(--ink)}
.hstat .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:6px}
.hstat .n{font-size:24px;font-weight:900;font-stretch:88%}
.hstat .n small{font-size:12px;color:var(--muted);font-weight:600;font-stretch:100%}
button.hstat .l::after{content:"Edit";text-transform:none;letter-spacing:0;color:var(--flame-1);font-weight:700;font-size:12px}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.macro{display:flex;flex-direction:column;gap:7px;min-width:0}
.macro .t{display:flex;flex-direction:column}
.macro .t b{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:800}
.macro .t span{font-size:16px;font-weight:850;white-space:nowrap}
.macro .t span small{font-size:12px;color:var(--muted);font-weight:600}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.bar>i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--flame-1),var(--flame-2));transition:width 1.1s var(--ease)}
.m-p .bar>i{background:var(--protein);box-shadow:0 0 12px var(--protein)}
.m-c .bar>i{background:var(--carbs);box-shadow:0 0 12px var(--carbs)}
.m-f .bar>i{background:var(--fat);box-shadow:0 0 12px var(--fat)}
.week-h{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);gap:8px;text-transform:uppercase;letter-spacing:.12em;font-weight:800}
.week-h b{color:var(--over)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.wd{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--muted);font-weight:800}
.wbar{position:relative;width:100%;max-width:30px;height:58px;border-radius:10px;background:rgba(255,255,255,.05);overflow:hidden;display:flex;align-items:flex-end}
.wbar i{display:block;width:100%;height:0;border-radius:10px;background:linear-gradient(to top,var(--flame-2),var(--flame-1));transition:height 1s var(--ease);transition-delay:calc(var(--i,0) * 45ms)}
.wd.over .wbar i{background:linear-gradient(to top,#B81E35,var(--over))}
.wd.sel span{color:var(--ink)}
.wd.sel .wbar{box-shadow:0 0 0 2px var(--ink)}
.wbar .lim{position:absolute;left:4px;right:4px;border-top:2px dotted rgba(255,255,255,.35);transition:bottom .6s var(--ease)}

/* Sections */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:4px}
.sec-h h2{margin:0;font-size:21px;font-weight:900;font-stretch:118%;letter-spacing:-.015em}
.add{border:0;background:none;color:var(--flame-1);font-weight:750;padding:6px 2px;font-size:14px}

/* Dishes: sideways carousel */
.dishes{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scrollbar-width:none;
  margin-inline:calc(-1 * max(16px, env(safe-area-inset-left,0px)));padding:2px max(16px, env(safe-area-inset-left,0px)) 8px;scroll-padding-inline:max(16px, env(safe-area-inset-left,0px))}
.dishes::-webkit-scrollbar{display:none}
.dish{flex:0 0 auto;width:min(250px,72vw);scroll-snap-align:start;position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:14px;display:flex;flex-direction:column;gap:12px;animation:rise .6s var(--ease) both;animation-delay:calc(var(--i,0) * 60ms)}
.dish::before{content:"";position:absolute;right:-60px;bottom:-80px;width:200px;height:200px;background:radial-gradient(circle,rgba(255,106,61,.22),transparent 65%);pointer-events:none}
.dish .pot{width:44px;height:44px;border-radius:15px;background:linear-gradient(135deg,var(--flame-1),var(--flame-2) 55%,var(--flame-3));color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 6px 18px rgba(255,90,60,.35)}
.dish .nm{min-width:0}
.dish .nm b{display:block;font-weight:850;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dish .nm small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dish .foot-row{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;position:relative}
.dish .per{font-size:26px;font-weight:900;font-stretch:84%;line-height:1}
.dish .per small{display:block;font-size:11px;color:var(--muted);font-weight:700;font-stretch:100%;text-transform:uppercase;letter-spacing:.1em;margin-top:3px}
.dish-empty{flex:1 0 calc(100% - 2 * max(16px, env(safe-area-inset-left,0px)));scroll-snap-align:start;border:1px dashed var(--line-2);border-radius:24px;padding:16px;color:var(--muted);font-size:13px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.98)}}

/* Diary */
#meals{display:flex;flex-direction:column;gap:12px}
.meal{background:var(--surface);border:1px solid var(--line);border-radius:24px;overflow:hidden}
.meal-h{display:flex;align-items:center;gap:11px;padding:12px 12px 12px 14px}
.meal-ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);color:var(--flame-1);flex:none}
.meal-h h3{margin:0;font-size:16px;font-weight:850;font-stretch:110%}
.meal-h .k{color:var(--muted);font-size:13px;margin-left:auto;font-weight:650}
.meal-h .add{width:36px;height:36px;border-radius:50%;background:var(--surface-2);color:var(--ink);display:grid;place-items:center;padding:0;flex:none}
.entry{display:flex;gap:10px;align-items:center;padding:11px 14px;border:0;border-top:1px solid var(--line);width:100%;text-align:left;background:none;color:inherit}
.entry .nm{flex:1;min-width:0}
.entry .nm b{display:block;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry .nm small{color:var(--muted);font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry .kc{font-weight:850;text-align:right;white-space:nowrap}
.entry .kc small{display:block;font-weight:600;font-size:11px;color:var(--muted)}
.entry.fresh{animation:fresh 1.1s var(--ease)}
@keyframes fresh{0%{opacity:0;transform:translateY(-8px);background:rgba(255,106,61,.28)}35%{opacity:1;transform:none;background:rgba(255,106,61,.18)}100%{background:transparent}}
.empty{padding:0 14px 14px 61px;color:var(--faint);font-size:13px;margin:0}
.entry-actions{display:flex;gap:8px;padding:0 14px 12px;justify-content:flex-end;align-items:center;flex-wrap:wrap;animation:drop .4s var(--ease)}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}}
.foot{color:var(--faint);font-size:12px;text-align:center;margin:0}

/* Buttons */
.btn{border-radius:15px;border:1px solid var(--line-2);background:var(--surface-2);padding:12px 16px;font-weight:750;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;text-decoration:none;color:var(--ink)}
.btn.primary{background:linear-gradient(135deg,var(--flame-1),var(--flame-2) 55%,var(--flame-3));color:var(--accent-ink);border-color:transparent;box-shadow:0 8px 26px rgba(255,90,60,.35),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.ghost{background:none;border-color:transparent}
.btn.small{min-height:36px;padding:6px 13px;font-size:13px;border-radius:12px}
.btn.small.primary{box-shadow:0 4px 16px rgba(255,90,60,.3),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.danger{color:var(--over)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:default}

/* Dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;pointer-events:none;
  padding:0 max(14px, env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(14px, env(safe-area-inset-left,0px))}
.dock::before{content:"";position:absolute;left:0;right:0;bottom:0;height:150%;background:linear-gradient(to top,var(--bg) 30%,rgba(10,12,18,0));pointer-events:none}
.dock-in{position:relative;pointer-events:auto;max-width:560px;margin:0 auto;display:flex;gap:6px;padding:6px;border-radius:26px;background:rgba(30,35,52,.7);-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);border:1px solid var(--line-2);box-shadow:0 16px 44px rgba(0,0,0,.5)}
.dock .btn{flex:1;font-size:16px;font-stretch:108%;min-height:54px;border-radius:20px}
.dock #searchBtn{background:transparent;border-color:transparent}

/* Sheets */
.shade{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.shade::before{content:"";position:absolute;inset:0;background:rgba(3,4,8,.62);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);opacity:0;transition:opacity .4s var(--ease)}
.shade.open::before{opacity:var(--fade,1)}
.shade.closing::before{opacity:0;transition-duration:.3s}
.sheet{position:relative;background:var(--surface);width:100%;max-width:560px;max-height:calc(100% - env(safe-area-inset-top,0px) - 10px);overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  border-radius:30px 30px 0 0;border:1px solid var(--line-2);border-bottom:0;box-shadow:0 -24px 70px rgba(0,0,0,.55);
  padding:8px max(16px, env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px));
  transform:translateY(105%);transition:transform .55s var(--ease);will-change:transform}
.shade.open .sheet{transform:none}
.shade.closing .sheet{transform:translateY(105%);transition:transform .32s cubic-bezier(.4,0,1,1)}
.grabber{width:42px;height:5px;border-radius:9px;background:rgba(255,255,255,.2);margin:2px auto 10px}
.sheet-body{display:flex;flex-direction:column;gap:14px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet-h h3{margin:0;font-size:23px;font-weight:900;font-stretch:116%;letter-spacing:-.015em;text-wrap:balance;min-width:0}
.sheet-h .iconbtn{flex:none;background:var(--surface-2)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-2);border-radius:99px;padding:8px 14px;background:var(--surface-2);font-size:13px;font-weight:750;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tool{border:1px solid var(--line);border-radius:18px;background:var(--surface-2);padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:750;font-size:13px;text-align:center;color:var(--ink)}
.tool svg{color:var(--flame-1)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lbl{font-size:12px;color:var(--muted);font-weight:700}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=search],select,textarea{width:100%;border:1px solid var(--line-2);background:var(--surface-2);border-radius:15px;padding:11px 14px;min-height:48px;font-size:16px;color:var(--ink);transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:rgba(255,122,61,.75);box-shadow:0 0 0 4px rgba(255,122,61,.16)}
input::placeholder,textarea::placeholder{color:var(--faint)}
.row{display:flex;gap:10px;align-items:flex-end}
.row>*{flex:1;min-width:0}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:rgba(255,255,255,.02)}
.list>.entry:first-child{border-top:0}
.grp{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:800;margin:4px 0 -6px}
.note{font-size:13px;color:var(--muted)}
.banner{border-radius:18px;padding:12px 14px;background:var(--surface-2);border:1px dashed var(--line-2);font-size:13px;display:flex;flex-direction:column;gap:8px}
.err{color:var(--over);font-size:13px;font-weight:600}
.code{font-family:var(--mono);letter-spacing:.06em}
.bigcode{font-family:var(--mono);font-size:24px;letter-spacing:.14em;font-weight:600;text-align:center;padding:12px;border:1.5px dashed var(--line-2);border-radius:18px;-webkit-user-select:all;user-select:all;background:var(--surface-2)}
details summary{list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"";display:inline-block;width:7px;height:7px;margin-left:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-3px) rotate(45deg);transition:transform .3s var(--ease)}
details[open] summary::after{transform:translateY(1px) rotate(225deg)}

/* Camera */
.finder{position:relative;border-radius:22px;overflow:hidden;background:#000;aspect-ratio:4/3;max-width:100%;width:100%}
.finder video,.finder img{width:100%;height:100%;object-fit:cover;display:block}
.finder .frame{--c:rgba(255,255,255,.95);--l:28px;--w:4px;position:absolute;left:12%;right:12%;top:27%;bottom:27%;border-radius:8px;
  box-shadow:0 0 0 999px rgba(0,0,0,.38);transition:transform .3s var(--ease);
  background:linear-gradient(var(--c),var(--c)) top left/var(--l) var(--w),linear-gradient(var(--c),var(--c)) top left/var(--w) var(--l),
    linear-gradient(var(--c),var(--c)) top right/var(--l) var(--w),linear-gradient(var(--c),var(--c)) top right/var(--w) var(--l),
    linear-gradient(var(--c),var(--c)) bottom left/var(--l) var(--w),linear-gradient(var(--c),var(--c)) bottom left/var(--w) var(--l),
    linear-gradient(var(--c),var(--c)) bottom right/var(--l) var(--w),linear-gradient(var(--c),var(--c)) bottom right/var(--w) var(--l);
  background-repeat:no-repeat}

/* =========================================================

const Data = {
  async getDay(k) {

        const s = await u.collection("days").doc(k).get();

      } catch (e) {}

  },
  setDay(k, entries) {

  },
  saveMe() {

  watch(c, cb) {

async function initRemote() {

/* Signing in: switch this device over to the account, bringing along anything
   logged here before signing in (only once per device). */
async function signedIn(user) {
  closeSheet(); stopRemote();
  const wasLocal = LS.ns === "local";
  const carry = wasLocal && !LS.get("carried", false, true) ? {
    days: LS.keys("day:").map(k => [k.slice(4), LS.get(k, [])]).filter(([, e]) => e.length),
    pantry: LS.get("col:mine:pantry", {}), dishes: LS.get("col:mine:dishes", {}), goals: me.goals, recent: me.recent
  } : null;
  R.user = user; LS.ns = user.uid; LS.set("everSignedIn", true, true);
  me = Object.assign(DEFAULT_ME(), LS.get("me", {})); me.pid = user.uid;
  const u = userRef();
  let fresh = true;
  try {
    const s = await u.get();
    if (s.exists) { fresh = false; const d = s.data(); if (d.goals) me.goals = { ...me.goals, ...d.goals }; if (Array.isArray(d.recent)) me.recent = d.recent; if (d.name) me.name = d.name; if ("family" in d) me.family = d.family || null; }
  } catch (e) {}
  if (!me.name && user.displayName) me.name = user.displayName;
  if (carry && (carry.days.length || Object.keys(carry.pantry).length || Object.keys(carry.dishes).length)) {
    const jobs = [];
    for (const [k, local] of carry.days) jobs.push((async () => {
      const doc = u.collection("days").doc(k), s = await doc.get();
      const remote = s.exists ? (s.data().entries || []) : [], ids = new Set(remote.map(e => e.id));
      await doc.set(clean({ entries: remote.concat(local.filter(e => !ids.has(e.id))), updated: Date.now() }));
    })());
    for (const [id, f] of Object.entries(carry.pantry)) jobs.push(u.collection("pantry").doc(id).set(clean(f), { merge: true }));
    for (const [id, d] of Object.entries(carry.dishes)) jobs.push(u.collection("dishes").doc(id).set(clean({ ...d, by: d.by && d.by.length < 20 ? user.uid : d.by }), { merge: true }));
    if (fresh) { me.goals = carry.goals; me.recent = carry.recent; }
    await Promise.allSettled(jobs);
    LS.set("carried", true, true);
    // it now lives in the account, so clear the signed-out copy on this device
    for (const [k] of carry.days) localStorage.removeItem("cs2:local:day:" + k);
    ["col:mine:pantry", "col:mine:dishes", "me"].forEach(k => localStorage.removeItem("cs2:local:" + k));
  }
  Data.saveMe();
  startWatches();
  const code = me.family;
  if (code) { try { await connectFamily(code); } catch (e) { me.family = null; Data.saveMe(); stopRemote(); startWatches(); } }
  await loadDay(); await loadWeek(); render(); renderAccount();
  if (!me.family && joinCode) openFamily();
}
function signedOut() {
  stopRemote(); R.user = null; LS.ns = "local"; me = loadMe();
  startWatches(); loadDay().then(loadWeek); render(); renderAccount();
  openAuth("in");
}

async function connectFamily(code, { create = false, name = "" } = {}) {
  const ref = R.fs.collection("families").doc(code);
  if (create) await ref.set({ name: name || "Our family", created: Date.now(), by: me.pid });
  else { const s = await ref.get(); if (!s.exists) throw new Error("No family uses that code. Check it with the person who sent it."); }
  // Share the foods and dishes from your account with the family the first time you join.
  if (!LS.get("sharedInto:" + code, false)) {
    const u = userRef();
    try {
      const [p, d] = await Promise.all([u.collection("pantry").get(), u.collection("dishes").get()]);
      const jobs = [];
      p.forEach(doc => jobs.push(ref.collection("pantry").doc(doc.id).set(doc.data(), { merge: true })));
      d.forEach(doc => jobs.push(ref.collection("dishes").doc(doc.id).set(doc.data(), { merge: true })));
      await Promise.allSettled(jobs);
    } catch (e) {}
    LS.set("sharedInto:" + code, true);
  }
  stopRemote();
  R.fam = ref; me.family = code;
  Data.saveMe();
  startWatches();
  R.unsubs.push(ref.onSnapshot(s => { S.famInfo = s.exists ? s.data() : null; renderHeader(); }, () => {}));
  render();
}

/* =========================================================

let sheetBack = null, sheetCleanup = [];
function runCleanup() { sheetCleanup.forEach(f => { try { f(); } catch (e) {} }); sheetCleanup = []; }
function openSheet(html, back = null) {
  runCleanup(); sheetBack = back;
  const inner = `<div class="grabber" aria-hidden="true"></div><div class="sheet-body">${html}</div>`;
  let shade = $("#shade"), sheet, body;
  if (shade) {
    // Already open: morph to the new screen instead of closing and reopening
    sheet = shade.querySelector(".sheet");
    const h0 = sheet.offsetHeight;
    sheet.style.transition = ""; sheet.style.transform = ""; shade.style.removeProperty("--fade");
    sheet.innerHTML = inner; sheet.scrollTop = 0;
    body = sheet.querySelector(".sheet-body");
    if (!reduced && sheet.animate) {
      const h1 = sheet.offsetHeight;
      if (Math.abs(h1 - h0) > 4) sheet.animate([{ height: h0 + "px" }, { height: h1 + "px" }], { duration: 420, easing: EASE });
      body.animate([{ opacity: 0, transform: "translateY(14px)" }, { opacity: 1, transform: "none" }], { duration: 360, easing: EASE });
    }
  } else {
    $("#sheetRoot").insertAdjacentHTML("beforeend", `<div class="shade" id="shade"><div class="sheet" role="dialog" aria-modal="true">${inner}</div></div>`);
    shade = $("#shade"); sheet = shade.querySelector(".sheet"); body = sheet.querySelector(".sheet-body");

  return body;
}
function closeSheet() {
  runCleanup(); sheetBack = null;
  const shade = $("#shade"); if (!shade) return;
  shade.removeAttribute("id"); shade.setAttribute("inert", "");
  shade.querySelectorAll("[id]").forEach(el => el.removeAttribute("id"));
  if (document.activeElement && shade.contains(document.activeElement)) document.activeElement.blur();
  const sheet = shade.querySelector(".sheet"); sheet.style.transition = ""; sheet.style.transform = "";
  shade.style.removeProperty("--fade");

function wireDrag(shade, sheet) {
  let y0 = null, x0 = 0, dy = 0, t0 = 0, active = false;
  sheet.addEventListener("touchstart", e => {
    y0 = null;
    if (e.touches.length !== 1) return;
    const onHead = e.target.closest(".grabber,.sheet-h");
    if (!onHead && (sheet.scrollTop > 0 || e.target.closest("input,textarea,select,.finder"))) return;
    y0 = e.touches[0].clientY; x0 = e.touches[0].clientX; dy = 0; t0 = performance.now(); active = false;
  }, { passive: true });
  sheet.addEventListener("touchmove", e => {
    if (y0 == null) return;
    const ny = e.touches[0].clientY - y0, nx = e.touches[0].clientX - x0;
    if (!active) {
      if (ny > 8 && ny > Math.abs(nx)) { active = true; sheet.style.transition = "none"; if (document.activeElement) document.activeElement.blur(); }
      else { if (ny < -4 || Math.abs(nx) > 10) y0 = null; return; }
    }
    e.preventDefault();
    dy = Math.max(0, ny);
    sheet.style.transform = `translateY(${dy}px)`;
    shade.style.setProperty("--fade", String(Math.max(0, 1 - dy / 520)));
  }, { passive: false });
  const end = () => {
    if (y0 == null) return; y0 = null;
    if (!active) return; active = false;
    const v = dy / Math.max(1, performance.now() - t0);
    sheet.style.transition = "";
    if (dy > 130 || (v > 0.55 && dy > 40)) { haptic(); dismiss(); }
    else { sheet.style.transform = ""; shade.style.removeProperty("--fade"); }
  };
  sheet.addEventListener("touchend", end); sheet.addEventListener("touchcancel", end);
}
function dismiss() { const b = sheetBack; if (b) b(); else closeSheet(); }
$("#sheetRoot").addEventListener("click", e => { if (e.target.id === "shade" || e.target.closest("[data-close]")) dismiss(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#shade")) dismiss(); });
const head = (title, back) => `<div class="sheet-h"><h3>${title}</h3><button class="iconbtn" data-close aria-label="${back ? "Back" : "Close"}">${back ? "‹" : "✕"}</button></div>`;
function chips(name, opts, sel) { return `<div class="chips" role="group" data-chips="${name}">${opts.map(([v, l]) => `<button class="chip" data-v="${esc(v)}" aria-pressed="${v === sel}">${esc(l)}</button>`).join("")}</div>`; }

let offTimes = [];
async function searchOFF(q) {
  offTimes = offTimes.filter(x => Date.now() - x < 60000);
  if (offTimes.length >= 9) throw new Error("Open Food Facts allows about 10 searches a minute. Wait a moment and try again.");
  offTimes.push(Date.now());
  const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 12000);
  try {
    const u = `https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=25&sort_by=unique_scans_n&fields=code,product_name,product_name_en,product_name_es,brands,nutriments,serving_size,serving_quantity`;
    const r = await fetch(u, { signal: ctl.signal });
    if (!r.ok) throw new Error(r.status === 429 || r.status === 503 ? "Open Food Facts is busy. Try again in a minute." : "Search failed. Try again.");
    const j = await r.json();
    return (j.products || []).map(offToFood).filter(Boolean);
  } catch (e) {
    if (e.name === "AbortError") throw new Error("Open Food Facts took too long to answer. Try again.");
    if (e instanceof TypeError) throw new Error("Couldn't reach Open Food Facts. Check your connection.");
    throw e;
  } finally { clearTimeout(tm); }
}
function offToFood(p) {
  const n = p.nutriments || {};
  let k100 = n["energy-kcal_100g"]; if (k100 == null && n["energy_100g"] != null) k100 = n["energy_100g"] / 4.184;
  const name = p.product_name || p.product_name_en || p.product_name_es;
  if (k100 == null || !name) return null;
  const sq = parseFloat(p.serving_quantity), g = sq > 0 ? sq : 100, f = g / 100;
  return { id: "bc-" + p.code, src: "off", code: String(p.code || ""), name, brand: (p.brands || "").split(",")[0].trim(),
    servingLabel: sq > 0 ? (p.serving_size || `${sq} g`) : "100 g", servingGrams: g,
    kcal: Math.round(k100 * f), protein: r1((n.proteins_100g || 0) * f), carbs: r1((n.carbohydrates_100g || 0) * f), fat: r1((n.fat_100g || 0) * f) };
}
async function fetchProduct(code) {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 9000);
  try {
    const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=code,product_name,product_name_en,product_name_es,brands,nutriments,serving_size,serving_quantity`, { signal: ctl.signal });
    if (!r.ok) return null;
    const j = await r.json(); if (j.status !== 1 || !j.product) return null;
    return offToFood({ ...j.product, code });
  } catch (e) { return null; } finally { clearTimeout(t); }
}
function blankFood(name = "") { return { id: "tmp-" + rid(6), src: "manual", code: "", name, brand: "", servingLabel: "1 serving", servingGrams: null, kcal: "", protein: "", carbs: "", fat: "" }; }

/* =========================================================
   Food sheet: nutrition label + how much (grams or servings)

function openFood(food, flow) {
  const pick = !!flow.pick;

    ${food.src === "off" ? `<p class="note">From Open Food Facts. Check against the pack if something looks off.</p>` : food.src === "db" ? `<p class="note">Typical values. Edit them to match your pack if you have it.</p>` : ""}

      <div class="rule-m"></div>
      <div class="sub">Amount per serving</div>

      <div class="ln"><span class="k"><span class="dot" style="background:var(--fat)"></span>Total fat (g)</span><input id="fF" type="number" inputmode="decimal" min="0" step="any" value="${food.fat}" aria-label="Fat grams"></div>
    </div>
    <div class="field"><span class="lbl">How much ${pick ? "goes in the dish" : "did you eat"}</span>
      <div class="amount"><input id="fAmt" type="number" inputmode="decimal" min="0" step="any" value="${startAmt}" aria-label="Amount">${chips("unit", [["g", "grams"], ["serv", "servings"]], unit)}</div>
      <p class="note" id="fUnitHint" hidden>Enter the grams per serving on the label above to log by weight.</p>
    </div>

    <p class="err" id="fErr" hidden></p>
    <button class="btn primary wide" id="fAdd">${pick ? "Add to dish" : "Add to " + meal}</button>`, flow.back || null);
  if (!pick) wireChips(sh, "meal", m => { meal = m; $("#fAdd").textContent = "Add to " + m; });

  });

    const amt = num("fAmt") || 0, g = num("fGrams");
    const mult = unit === "g" ? (g > 0 ? amt / g : 0) : amt;
    const t = { kcal: (num("fK") || 0) * mult, protein: (num("fP") || 0) * mult, carbs: (num("fC") || 0) * mult, fat: (num("fF") || 0) * mult };

    if (!f.name) return err("Give the food a name.");

      cache.pantry[id] = { ...rest, used: Date.now() };
    }
    remember(id);
    const grams = unit === "g" ? amt : (g > 0 ? amt * g : null);
    const qty = unit === "g" ? `${r1(amt)} g` : `${r1(amt)} × ${f.servingLabel}`;
    const out = { name: f.name, brand: f.brand, qty, grams, foodId: id, kcal: Math.round(t.kcal), protein: r1(t.protein), carbs: r1(t.carbs), fat: r1(t.fat) };
    if (pick) { flow.pick(out); return; }

  };
}

let scanFlow = null;
async function startScan(flow) {
  scanFlow = flow;
  const back = flow.pick ? flow.back : null;
  const sh = openSheet(`${head("Scan a barcode", !!back)}
    <div class="finder"><video id="vid" playsinline muted autoplay></video><div class="frame"></div><div class="laser"></div></div>
    <p class="note" id="camMsg">Starting the camera…</p>
    <div class="row"><button class="btn" id="usePhoto">Take a photo instead</button><button class="btn" id="typeCode">Type the number</button></div>`, back);

  $("#typeCode").onclick = () => openCodeEntry(flow);

  sheetCleanup.push(stop);
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
  } catch (e) {
    $("#camMsg").textContent = e && e.name === "NotAllowedError" ? "Camera access was blocked. Allow it in Settings › Safari › Camera (or for this app), or take a photo instead." : "Couldn't start the camera. Take a photo instead.";

  }

  const v = $("#vid"); v.srcObject = stream;
  try { await v.play(); } catch (e) {}

  const c = document.createElement("canvas"), ctx = c.getContext("2d", { willReadFrequently: true });
  const tick = async () => {
    if (stopped) return;
    frame++;

      if (detector) { try { const r = await detector.detect(v); if (r && r[0]) code = r[0].rawValue; } catch (e) {} }
      if (!code) {
        // centre band of the frame, where the box is
        const vw = v.videoWidth, vh = v.videoHeight, cw = Math.round(vw * .8), ch = Math.round(vh * .5);
        const sc = Math.min(1, 900 / cw), w = Math.round(cw * sc), h = Math.round(ch * sc);
        c.width = w; c.height = h; ctx.drawImage(v, (vw - cw) / 2, (vh - ch) / 2, cw, ch, 0, 0, w, h);

  };

}
$("#photoFile").addEventListener("change", async e => {
  const file = e.target.files && e.target.files[0]; if (!file || !scanFlow) return;
  const flow = scanFlow, u = URL.createObjectURL(file);
  openSheet(`${head("Reading barcode")}<div class="finder"><img src="${u}" alt="Your photo"><div class="laser"></div></div><p class="note">Looking for the bars…</p>`, flow.pick ? flow.back : null);
  let code = null; try { code = await decodePhoto(file); } catch (err) {}
  URL.revokeObjectURL(u);
  if (code) return lookup(code, flow);
  const sh = openSheet(`${head("No barcode found", !!flow.pick)}<p>Couldn't read a barcode in that photo. Get closer so the bars fill most of the picture, in good light.</p>
    <div class="row"><button class="btn primary" id="again">Scan again</button><button class="btn" id="typ">Type the number</button></div>`, flow.pick ? flow.back : null);

});
async function decodePhoto(file) {
  const img = await new Promise((res, rej) => { const i = new Image(), u = URL.createObjectURL(file); i.onload = () => res(i); i.onerror = rej; i.src = u; });
  if (detector) { try { const r = await detector.detect(img); if (r && r[0]) return normCode(r[0].rawValue) || r[0].rawValue; } catch (e) {} }
  for (const [max, rot, crop] of [[1280, 0, 1], [900, 0, 1], [1280, 0, .6], [1280, 1, 1], [1800, 0, 1], [900, 1, .6]]) {

}
function openCodeEntry(flow) {

    <form id="cForm" class="field"><label for="cIn">The digits under the bars</label><input id="cIn" type="text" inputmode="numeric" class="code" placeholder="8410000000000" data-autofocus></form>

async function lookup(code, flow) {

function copyBtn(id, text) {
  const b = $("#" + id); if (!b) return;
  b.onclick = async () => {
    try { await navigator.clipboard.writeText(text); toast("Copied"); }
    catch (e) { const r = document.createRange(), el = b.previousElementSibling; if (el) { r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } toast("Select and copy the text above", true); }
  };
}
function accountRow() {
  return `<div class="banner" style="flex-direction:row;align-items:center;border-style:solid"><span style="flex:1;min-width:0"><b>${esc(me.name || "Signed in")}</b><br><span class="note" style="word-break:break-all">${esc(R.user.email || "")}</span></span><button class="btn small" id="signOut" style="flex:none">Sign out</button></div>`;
}
function wireSignOut() {
  let armed = false;
  const b = $("#signOut"); if (!b) return;
  b.onclick = async () => {
    if (!armed) { armed = true; b.textContent = "Tap to confirm"; return; }
    closeSheet(); await firebase.auth().signOut(); toast("Signed out");
  };
}
function memListHtml() {
  const members = Object.entries(cache.members).sort((a, b) => (a[1].joined || 0) - (b[1].joined || 0));
  return members.map(([pid, m]) => `<div class="entry"><span class="nm"><b>${esc(pid === me.pid ? (m.name || "You") + " (you)" : m.name || "Someone")}</b></span></div>`).join("") || `<p class="empty" style="padding:12px 14px">Just you so far.</p>`;
}
function openFamily() {
  if (!window.FIREBASE_CONFIG) {
    openSheet(`${head("Family & accounts")}<p>Accounts and family sharing aren't switched on for this website yet. Until they are, this device keeps its own diary, foods and dishes.</p>
      <p class="note">Whoever set up the site turns them on by creating a free Firebase project and pasting its settings into <span class="code">config.js</span>. The steps are in the README that came with the app.</p>`);
    return;
  }
  if (!R.fs) {
    openSheet(`${head("Family & accounts")}<p class="err">Couldn't connect to your account${R.err ? `: ${esc(R.err)}` : ""}.</p><p class="note">Check your connection and reopen the app.</p>`);
    return;
  }
  if (!R.user) {
    openSheet(`${head("Family & accounts")}
      <p>Sign in to keep your diary on every device and share dishes with your family. Everyone keeps their own diary and limit, and logs their own portion of shared dishes.</p>
      ${joinCode ? `<div class="banner">You've been invited to a family. Sign in or create an account to join.</div>` : ""}
      <div class="row"><button class="btn primary" id="toUp">Create account</button><button class="btn" id="toIn">Sign in</button></div>`);
    $("#toUp").onclick = () => openAuth("up"); $("#toIn").onclick = () => openAuth("in");
    return;
  }
  if (!R.fam) {
    const sh = openSheet(`${head("Family")}
      ${accountRow()}
      <p>Share dishes and foods with your family. Everyone keeps their own private diary and limit, and logs their own portion of shared dishes.</p>
      ${joinCode ? `<div class="grp">You've been invited</div>
        <div class="row"><div class="field"><label for="jc">Family code</label><input id="jc" type="text" class="code" autocapitalize="none" autocomplete="off" value="${esc(joinCode)}"></div><button class="btn primary" id="jn" style="flex:none">Join</button></div>` : `
      <div class="grp">Start a family</div>
      <div class="row"><div class="field"><label for="fn">Family name</label><input id="fn" type="text" placeholder="The Rehns"></div><button class="btn primary" id="mk" style="flex:none">Create</button></div>
      <div class="grp">Or join one</div>
      <div class="row"><div class="field"><label for="jc">Family code</label><input id="jc" type="text" class="code" autocapitalize="none" autocomplete="off" placeholder="from the invite"></div><button class="btn" id="jn" style="flex:none">Join</button></div>`}
      <p class="err" id="famErr" hidden></p>`);
    wireSignOut();
    const go = async (create) => {
      const err = m => { $("#famErr").textContent = m; $("#famErr").hidden = false; };
      const code = create ? rid(10) : $("#jc").value.replace(/[^a-z0-9]/gi, "").toLowerCase();
      if (!create && code.length < 6) return err("Enter the family code from the invite.");
      try {
        sh.querySelectorAll("button").forEach(b => b.disabled = true);
        await connectFamily(code, { create, name: create ? $("#fn").value.trim() : "" });
        await loadDay(); openFamily(); toast(create ? "Family created" : "You've joined the family");
      } catch (e) { sh.querySelectorAll("button").forEach(b => b.disabled = false); err(e.message || "Couldn't connect. Try again."); }
    };
    if ($("#mk")) $("#mk").onclick = () => go(true);
    $("#jn").onclick = () => go(false);
    return;
  }
  openSheet(`${head(esc(S.famInfo?.name || "Family"))}
    ${accountRow()}
    <div class="field"><label for="fnm">Family name</label><input id="fnm" type="text" value="${esc(S.famInfo?.name || "")}"></div>
    <div class="field"><label for="myName2">Your name</label><input id="myName2" type="text" value="${esc(me.name)}"></div>
    <div class="grp">Members</div>
    <div class="list" id="memList">${memListHtml()}</div>
    <div class="grp">Invite someone</div>
    <p class="note">Send them this link. They open it in Safari, add it to their Home Screen, create an account and join. Or they can type the code in the Family screen.</p>
    <div class="banner"><span class="code" style="word-break:break-all;user-select:all">${esc(inviteLink(me.family))}</span><button class="btn small" id="cpLink" style="align-self:flex-start">Copy invite link</button></div>
    <div class="bigcode">${esc(me.family)}</div>
    <button class="btn primary wide" id="famSave">Save names</button>
    <button class="btn ghost small danger" id="leave">Leave this family</button>`);
  copyBtn("cpLink", inviteLink(me.family)); wireSignOut();
  $("#famSave").onclick = () => {
    const fn = $("#fnm").value.trim(), mn = $("#myName2").value.trim();
    if (fn && fn !== S.famInfo?.name) R.fam.set({ name: fn }, { merge: true }).catch(remoteFail);
    if (mn) { me.name = mn; Data.saveMe(); renderAccount(); }
    closeSheet(); toast("Saved");
  };
  let armed = false;
  $("#leave").onclick = () => {
    if (!armed) { armed = true; $("#leave").textContent = "Tap again to leave. Your diary stays in your account."; return; }
    if (R.fam) R.fam.collection("members").doc(me.pid).delete().catch(() => {});
    stopRemote(); me.family = null; Data.saveMe(); startWatches(); closeSheet(); render(); renderAccount(); toast("You've left the family");
  };
}

/* =========================================================
   Install hint (iPhone/iPad Safari, not yet on the Home Screen)
   ========================================================= */
const standalone = window.navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
const ios = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
if (ios && !standalone && !LS.get("installTipX", false, true)) $("#installTip").hidden = false;
$("#installX").onclick = () => { $("#installTip").hidden = true; LS.set("installTipX", true, true); };
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});

/* =========================================================
   Boot
   ========================================================= */
startWatches();
render();
loadDay().then(loadWeek);
(async () => {
  const note = $("#storeNote");
  const ok = await initRemote();
  if (!ok) { note.textContent = window.FIREBASE_CONFIG ? "Couldn't reach your account, so this device is saving on its own for now." : "Your diary is saved on this device."; renderAccount(); return; }
  renderAccount();
  let first = true;
  firebase.auth().onAuthStateChanged(async user => {
    const wasFirst = first; first = false;
    if (user) {
      if (R.user && R.user.uid === user.uid) return;
      note.textContent = "Loading your account…";
      await signedIn(user);
      note.textContent = R.fam ? `Signed in as ${user.email}. Sharing with ${S.famInfo?.name || "your family"}.` : `Signed in as ${user.email}. Your diary syncs to every device you sign in on.`;
    } else {
      if (R.user) signedOut();
      note.textContent = "Saved on this device only. Sign in to keep it on all your devices.";
      renderAccount();
      if (wasFirst && (!LS.get("skipAuth", false, true) || joinCode)) openAuth(joinCode || !LS.get("everSignedIn", false, true) ? "up" : "in");
    }
  });
})();
})();
</script>
</body>
</html>
