<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Calorie Scanner</title>
<meta name="description" content="Scan barcodes, search foods and log calories together as a family.">
<meta name="theme-color" content="#17734A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Calories">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: one-column phone diary. The day's equation and 7-day strip up top, shared dishes,
   then meals; a fixed scan/search bar at the bottom. Sheets borrow the black rules of a nutrition label. */
:root{
  --bg:#EEF2EE; --surface:#FFFFFF; --ink:#141B17; --muted:#5B6862; --line:#D5DDD7;
  --accent:#17734A; --accent-ink:#FFFFFF; --laser:#E0312B;
  --protein:#3A68CF; --carbs:#C9861C; --fat:#A64A9E; --over:#C23B30; --over-bg:#FBE9E7;
  --shade:rgba(10,20,15,.45);
  --display:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0F1512; --surface:#18201C; --ink:#E9EFEA; --muted:#93A39A; --line:#2B3630;
  --accent:#3DBA7E; --accent-ink:#06140D; --laser:#FF5A4F;
  --protein:#7A9DF0; --carbs:#E5A84A; --fat:#D27BC9; --over:#FF6B5E; --over-bg:#3A1D1A; --shade:rgba(0,0,0,.6);
  color-scheme:dark}}

*{box-sizing:border-box}
html,body{background:var(--bg);margin:0}
body{color:var(--ink);font-family:var(--display);font-size:15px;line-height:1.4;font-variant-numeric:tabular-nums;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top,0px);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-block:14px 120px;display:flex;flex-direction:column;gap:14px}

/* Header */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-weight:900;font-stretch:115%;font-size:20px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;min-width:0}
.brand svg{flex:none}
.top-r{display:flex;gap:8px;align-items:center}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;min-width:40px;height:40px;display:inline-grid;place-items:center;padding:0 10px}
.famchip{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px;max-width:150px}
.famchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.datebar .day{font-weight:800;font-stretch:105%;font-size:17px;text-align:center;flex:1}
.datebar .day small{display:block;font-weight:500;font-size:12px;color:var(--muted);font-stretch:100%}
.install{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:13px}
.install p{margin:0;flex:1}

/* Summary */
.summary{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px}
.summary.over{border-color:var(--over);box-shadow:0 0 0 1px var(--over) inset}
.eq{display:grid;grid-template-columns:1fr auto 1fr auto 1.25fr;align-items:end;gap:6px;text-align:center}
.eq .n{font-weight:800;font-size:20px;font-stretch:90%;line-height:1.1}
.eq .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.eq .op{color:var(--muted);font-size:18px;padding-bottom:16px}
.eq .rem .n{font-size:30px;font-weight:900;color:var(--accent)}
.summary.over .eq .rem .n,.summary.over .eq .rem .l{color:var(--over)}
.eq button{border:0;background:none;padding:0}
.overmsg{background:var(--over-bg);color:var(--over);border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;position:relative}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.bar.over>i{background:var(--over)}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.macro{display:flex;flex-direction:column;gap:5px;min-width:0}
.macro .t{display:flex;justify-content:space-between;font-size:12px;gap:4px}
.macro .t b{font-weight:700}
.macro .t span{color:var(--muted);white-space:nowrap}
.macro .bar{height:5px}
.m-p .bar>i{background:var(--protein)} .m-c .bar>i{background:var(--carbs)} .m-f .bar>i{background:var(--fat)}

/* Week strip */
.week-h{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);gap:8px}
.week-h b{color:var(--over);font-weight:700}
.week{position:relative;display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.wbar{position:relative;width:100%;max-width:30px;height:52px;border-radius:6px;background:var(--bg);overflow:hidden;display:flex;align-items:flex-end}
.wbar i{display:block;width:100%;background:var(--accent);opacity:.85}
.wd.over .wbar i{background:var(--over);opacity:1}
.wd.sel span{color:var(--ink);font-weight:800}
.wd.sel .wbar{outline:2px solid var(--ink);outline-offset:1px}
.wbar .lim{position:absolute;left:0;right:0;border-top:2px dashed var(--muted);opacity:.7}

/* Sections & cards */
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.sec-h h2{margin:0;font-size:13px;font-weight:800;font-stretch:110%;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.meal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.meal-h{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;gap:8px}
.meal-h h3{margin:0;font-size:15px;font-weight:800;font-stretch:110%;text-transform:uppercase;letter-spacing:.04em}
.meal-h .k{color:var(--muted);font-size:13px;margin-left:auto}
.add{border:0;background:none;color:var(--accent);font-weight:700;padding:6px 2px}
.entry{display:flex;gap:10px;align-items:center;padding:10px 14px;border:0;border-top:1px solid var(--line);width:100%;text-align:left;background:none}
.entry .nm{flex:1;min-width:0}
.entry .nm b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry .nm small{color:var(--muted);font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry .kc{font-weight:700;text-align:right;white-space:nowrap}
.entry .kc small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.empty{padding:0 14px 12px;color:var(--muted);font-size:13px;margin:0}
.entry-actions{display:flex;gap:8px;padding:0 14px 12px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.foot{color:var(--muted);font-size:12px;text-align:center;margin:0}
.dishes{display:flex;flex-direction:column;gap:10px}
.dish{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;align-items:center;gap:12px}
.dish .pot{flex:none;width:40px;height:40px;border-radius:10px;background:var(--bg);display:grid;place-items:center;color:var(--accent)}
.dish .nm{flex:1;min-width:0}
.dish .nm b{display:block;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dish .nm small{display:block;color:var(--muted);font-size:12px}
.dish-empty{border:1px dashed var(--line);border-radius:var(--r);padding:14px;color:var(--muted);font-size:13px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}

/* Bottom bar */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;
  padding:10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background:linear-gradient(to top, var(--bg) 70%, transparent)}
.dock-in{max-width:560px;margin:0 auto;display:flex;gap:10px}
.btn{border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:12px 16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.ghost{background:none}
.btn.small{min-height:36px;padding:6px 12px;font-size:13px;border-radius:10px}
.btn.danger{color:var(--over)}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.dock .btn{flex:1;font-size:16px;font-stretch:108%}

/* Sheet */
.shade{position:fixed;inset:0;background:var(--shade);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:calc(100% - env(safe-area-inset-top, 0px) - 12px);overflow:auto;-webkit-overflow-scrolling:touch;border-radius:20px 20px 0 0;
  padding:18px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}.laser{animation:none!important}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet-h h3{margin:0;font-size:19px;font-weight:900;font-stretch:112%;text-wrap:balance}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:99px;padding:6px 12px;background:none;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tool{border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;font-size:13px;text-align:center}
.tool svg{color:var(--accent)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.lbl{font-size:12px;color:var(--muted);font-weight:600}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;min-height:44px;font-size:16px}
.row{display:flex;gap:10px;align-items:flex-end}
.row>*{flex:1;min-width:0}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.list>.entry:first-child,.list>.est:first-child{border-top:0}
.grp{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin:4px 0 -6px}
.note{font-size:13px;color:var(--muted);margin:0}
p{margin:0}
.banner{border-radius:12px;padding:12px;background:var(--bg);border:1px dashed var(--line);font-size:13px;display:flex;flex-direction:column;gap:8px}
.err{color:var(--over);font-size:13px}
a{color:var(--accent)}
.code{font-family:var(--mono);letter-spacing:.06em}
.bigcode{font-family:var(--mono);font-size:24px;letter-spacing:.12em;font-weight:600;text-align:center;padding:10px;border:2px dashed var(--line);border-radius:12px;user-select:all}

/* Camera */
.finder{position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:4/3;max-width:100%;width:100%}
.finder video,.finder img{width:100%;height:100%;object-fit:cover;display:block}
.finder .frame{position:absolute;left:10%;right:10%;top:30%;bottom:30%;border:2px solid rgba(255,255,255,.85);border-radius:10px}
.laser{position:absolute;left:12%;right:12%;height:2px;background:var(--laser);box-shadow:0 0 10px 2px var(--laser);top:32%;animation:sweep 1.4s ease-in-out infinite alternate}
@keyframes sweep{to{top:68%}}

/* Nutrition label */
.label{border:2px solid var(--ink);padding:8px 10px 10px;display:flex;flex-direction:column}
.label .title{font-weight:900;font-stretch:72%;font-size:34px;line-height:1;letter-spacing:-.01em;border-bottom:1px solid var(--ink);padding-bottom:4px}
.label .rule-xl{height:10px;background:var(--ink);margin:6px 0 4px}
.label .rule-m{height:4px;background:var(--ink);margin:4px 0}
.label .ln{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 0;border-top:1px solid var(--ink)}
.label .ln.first{border-top:0}
.label .ln .k{font-weight:800}
.label .ln input{width:96px;min-height:34px;padding:4px 8px;text-align:right;font-weight:700;border-radius:6px}
.label .ln.cal .k{font-size:22px;font-weight:900;font-stretch:80%}
.label .ln.cal input{font-size:20px;width:110px}
.label .sub{font-size:12px;font-weight:700}
.label .nm-in{border:0;background:none;padding:6px 0 0;min-height:0;font-weight:800;font-size:17px;border-radius:0}
.label .br-in{border:0;background:none;padding:0;min-height:0;font-size:13px;color:var(--muted);border-radius:0}
.label .nm-in:focus,.label .br-in:focus{outline:none;box-shadow:inset 0 -2px 0 var(--accent)}
.label .serv{display:flex;gap:8px;align-items:center;font-size:13px}
.label .serv input{min-height:32px;padding:4px 8px;border-radius:6px;font-size:15px}
.label .serv .sz{flex:1;min-width:0}
.label .serv .gr{width:72px;text-align:right}
.total{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:12px;background:var(--bg)}
.total .big{font-size:26px;font-weight:900;font-stretch:90%}
.total .mac{font-size:13px;color:var(--muted)}
.amount{display:flex;gap:10px;align-items:center}
.amount input{flex:1;min-width:0;font-size:22px;font-weight:800;text-align:right}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:3px;vertical-align:1px}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:rot .8s linear infinite;display:inline-block;vertical-align:-3px}
@keyframes rot{to{transform:rotate(360deg)}}
.pot-meter{display:flex;flex-direction:column;gap:6px}
.pot-meter .bar{height:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats div{background:var(--bg);border-radius:10px;padding:8px 4px}
.stats b{display:block;font-size:18px;font-weight:900;font-stretch:90%}
.stats small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.x{border:0;background:none;color:var(--muted);font-size:18px;padding:4px 8px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.18);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:99px;font-weight:600;font-size:14px;z-index:40;max-width:calc(100% - 32px);text-align:center}
#toast.bad{background:var(--over);color:#fff}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header class="top">
    <div class="brand">
      <svg width="26" height="20" viewBox="0 0 26 20" aria-hidden="true"><g fill="currentColor"><rect x="0" width="2" height="20"/><rect x="4" width="1" height="20"/><rect x="7" width="3" height="20"/><rect x="12" width="1" height="20"/><rect x="15" width="2" height="20"/><rect x="19" width="1" height="20"/><rect x="22" width="1" height="20"/><rect x="24" width="2" height="20"/></g><rect x="-1" y="9" width="28" height="2" fill="var(--laser)"/></svg>
      Calories
    </div>
    <div class="top-r">
      <button class="iconbtn famchip" id="famBtn" aria-label="Family">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M15.5 14.2c3 .2 5.5 2.6 5.5 5.8"/></svg>
        <span id="famName">Family</span>
      </button>
      <button class="iconbtn" id="goalsBtn" aria-label="Daily limit and goals">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>
      </button>
    </div>
  </header>

  <div class="install" id="installTip" hidden>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="flex:none;color:var(--accent)"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>
    <p><b>Install it as an app:</b> tap the Share button in Safari, then <b>Add to Home Screen</b>. It opens full-screen like a normal app.</p>
    <button class="x" id="installX" aria-label="Dismiss">✕</button>
  </div>

  <nav class="datebar" aria-label="Day">
    <button class="iconbtn" id="prevDay" aria-label="Previous day">‹</button>
    <div class="day" id="dayLabel">Today<small>&nbsp;</small></div>
    <button class="iconbtn" id="nextDay" aria-label="Next day">›</button>
  </nav>

  <section class="summary" id="summary" aria-label="Calories for the day">
    <div class="eq">
      <button id="limitBtn" aria-label="Change daily limit"><div class="n" id="sGoal">2,000</div><div class="l">Limit</div></button>
      <div class="op">−</div>
      <div><div class="n" id="sFood">0</div><div class="l">Food</div></div>
      <div class="op">=</div>
      <div class="rem"><div class="n" id="sRem">2,000</div><div class="l" id="sRemL">Remaining</div></div>
    </div>
    <div class="overmsg" id="overMsg" hidden></div>
    <div class="bar" id="sBar"><i style="width:0%"></i></div>
    <div class="macros">
      <div class="macro m-p"><div class="t"><b>Protein</b><span id="mP">0 / 150 g</span></div><div class="bar"><i style="width:0%"></i></div></div>
      <div class="macro m-c"><div class="t"><b>Carbs</b><span id="mC">0 / 200 g</span></div><div class="bar"><i style="width:0%"></i></div></div>
      <div class="macro m-f"><div class="t"><b>Fat</b><span id="mF">0 / 65 g</span></div><div class="bar"><i style="width:0%"></i></div></div>
    </div>
    <div class="week-h"><span>Last 7 days</span><span id="weekNote"></span></div>
    <div class="week" id="week"></div>
  </section>

  <div class="sec-h"><h2 id="dishTitle">Dishes</h2><button class="add" id="newDishBtn">+ Create a dish</button></div>
  <div class="dishes" id="dishes"></div>

  <div class="sec-h"><h2>Your diary</h2></div>
  <div id="meals" style="display:flex;flex-direction:column;gap:12px"></div>
  <p class="foot" id="storeNote"></p>
  <p class="foot">Product data from <a href="https://world.openfoodfacts.org" target="_blank" rel="noopener">Open Food Facts</a> (ODbL).</p>
</div>

<div class="dock">
  <div class="dock-in">
    <button class="btn primary" id="scanBtn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M3 7V4h3M18 4h3v3M21 17v3h-3M6 20H3v-3"/><path d="M7 8v8M10 8v8M13 8v8M16 8v8" stroke-width="1.6"/></svg>
      Scan
    </button>
    <button class="btn" id="searchBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      Search food
    </button>
  </div>
</div>

<input type="file" accept="image/*" capture="environment" id="photoFile" class="vh" tabindex="-1" aria-hidden="true">
<div id="sheetRoot"></div>
<div id="toast" role="status" hidden></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
// Firebase is only loaded when family sharing is configured.

/* =========================================================
   Data
   - Not signed in: everything stays on this device (localStorage).
   - Signed in: your diary, limit, foods and dishes live in your account
     (users/<uid>), cached on the device so it works offline.
   - In a family: foods, dishes and who-ate-what are shared
     (families/<code>); your diary stays private to your account.
   ========================================================= */
const url = new URL(location.href);
const joinCode = (url.searchParams.get("family") || "").replace(/[^a-z0-9]/gi, "").toLowerCase() || null;
const DEFAULT_ME = () => ({ pid: null, name: "", family: null, goals: { kcal: 2000, protein: 150, carbs: 200, fat: 65 }, recent: [] });
function loadMe() { const m = Object.assign(DEFAULT_ME(), LS.get("me", {})); if (!m.pid) m.pid = rid(14); LS.set("me", m); return m; }

const R = { fs: null, user: null, fam: null, err: null, unsubs: [] };
let listeners = {}; // collections kept on the device
const cache = { pantry: {}, dishes: {}, members: {} };

const userRef = () => R.fs && R.user ? R.fs.collection("users").doc(R.user.uid) : null;
const base = () => R.fam || userRef();
const refFor = c => c.split("/").reduce((r, seg, i) => i % 2 ? r.doc(seg) : r.collection(seg), base());
function colKey(c) { return "col:" + (R.fam ? R.fam.id : "mine") + ":" + c; }
function localCol(c) { return LS.get(colKey(c), {}); }
function emit(c) { (listeners[c] || []).forEach(fn => fn(localCol(c))); }

const Data = {
  async getDay(k) {
    const local = LS.get("day:" + k, null);
    const u = userRef();
    if (u) {
      try {
        const s = await u.collection("days").doc(k).get();
        if (s.exists) { const e = s.data().entries || []; LS.set("day:" + k, e); return e; }
      } catch (e) {}
    }
    return local || [];
  },
  setDay(k, entries) {
    LS.set("day:" + k, entries);
    const u = userRef();
    if (u) u.collection("days").doc(k).set(clean({ entries, updated: Date.now() })).catch(remoteFail);
  },
  saveMe() {
    LS.set("me", me);
    const u = userRef();
    if (u) u.set(clean({ name: me.name, goals: me.goals, recent: me.recent, family: me.family || null }), { merge: true }).catch(remoteFail);
    if (R.fam && me.name) R.fam.collection("members").doc(me.pid).set({ name: me.name, joined: cache.members[me.pid]?.joined || Date.now() }).catch(remoteFail);
  },
  watch(c, cb) {
    if (base()) {
      let q = base().collection(c);
      if (c === "dishes") q = q.orderBy("at", "desc").limit(100);
      cb(localCol(c)); // saved copy while the live one loads
      const key = colKey(c);
      const un = q.onSnapshot(s => { const m = {}; s.forEach(d => m[d.id] = d.data()); LS.set(key, m); cb(m); }, remoteFail);
      R.unsubs.push(un);
      return un;
    }
    (listeners[c] = listeners[c] || []).push(cb); cb(localCol(c));
    return () => { listeners[c] = (listeners[c] || []).filter(f => f !== cb); };
  },
  put(c, id, data) {
    if (base()) return refFor(c).doc(id).set(clean(data)).catch(remoteFail);
    const m = localCol(c); m[id] = clean(data); LS.set(colKey(c), m); emit(c); return Promise.resolve();
  },
  del(c, id) {
    if (base()) return refFor(c).doc(id).delete().catch(remoteFail);
    const m = localCol(c); delete m[id]; LS.set(colKey(c), m); emit(c); return Promise.resolve();
  },
  watchPath(c, cb) { // nested collection, e.g. dishes/<id>/logs
    if (base()) return refFor(c).onSnapshot(s => { const m = {}; s.forEach(d => m[d.id] = d.data()); cb(m); }, () => cb({}));
    (listeners[c] = listeners[c] || []).push(cb); cb(localCol(c));
    return () => { listeners[c] = (listeners[c] || []).filter(f => f !== cb); };
  }
};
let lastFail = 0;
function remoteFail(e) { console.warn(e); if (Date.now() - lastFail > 10000) { lastFail = Date.now(); toast("Couldn't reach your account. Changes are kept on this device and sync when you're back online.", true); } }

async function initRemote() {
  if (!window.FIREBASE_CONFIG || !window.firebase) return false;
  try {
    if (!firebase.apps.length) firebase.initializeApp(window.FIREBASE_CONFIG);
    R.fs = firebase.firestore();
    try { await R.fs.enablePersistence({ synchronizeTabs: true }); } catch (e) {}
    return true;
  } catch (e) { R.err = e && e.message || String(e); R.fs = null; return false; }
}
function stopRemote() {
  R.unsubs.forEach(u => { try { u(); } catch (e) {} }); R.unsubs = [];
  R.fam = null; S.famInfo = null; listeners = {};
  cache.pantry = {}; cache.dishes = {}; cache.members = {};
}

/* Signing in: switch this device over to the account, bringing along anything
   logged here before signing in (only once per device). */
async function signedIn(user) {
  closeSheet(); stopRemote();
  const wasLocal = LS.ns === "local";
  const carry = wasLocal && !LS.get("carried", false, true) ? {
    days: LS.keys("day:").map(k => [k.slice(4), LS.get(k, [])]).filter(([, e]) => e.length),
    pantry: LS.get("col:mine:pantry", {}), dishes: LS.get("col:mine:dishes", {}), goals: me.goals, recent: me.recent
  } : null;
  R.user = user; LS.ns = user.uid; LS.set("everSignedIn", true, true);
  me = Object.assign(DEFAULT_ME(), LS.get("me", {})); me.pid = user.uid;
  const u = userRef();
  let fresh = true;
  try {
    const s = await u.get();
    if (s.exists) { fresh = false; const d = s.data(); if (d.goals) me.goals = { ...me.goals, ...d.goals }; if (Array.isArray(d.recent)) me.recent = d.recent; if (d.name) me.name = d.name; if ("family" in d) me.family = d.family || null; }
  } catch (e) {}
  if (!me.name && user.displayName) me.name = user.displayName;
  if (carry && (carry.days.length || Object.keys(carry.pantry).length || Object.keys(carry.dishes).length)) {
    const jobs = [];
    for (const [k, local] of carry.days) jobs.push((async () => {
      const doc = u.collection("days").doc(k), s = await doc.get();
      const remote = s.exists ? (s.data().entries || []) : [], ids = new Set(remote.map(e => e.id));
      await doc.set(clean({ entries: remote.concat(local.filter(e => !ids.has(e.id))), updated: Date.now() }));
    })());
    for (const [id, f] of Object.entries(carry.pantry)) jobs.push(u.collection("pantry").doc(id).set(clean(f), { merge: true }));
    for (const [id, d] of Object.entries(carry.dishes)) jobs.push(u.collection("dishes").doc(id).set(clean({ ...d, by: d.by && d.by.length < 20 ? user.uid : d.by }), { merge: true }));
    if (fresh) { me.goals = carry.goals; me.recent = carry.recent; }
    await Promise.allSettled(jobs);
    LS.set("carried", true, true);
    // it now lives in the account, so clear the signed-out copy on this device
    for (const [k] of carry.days) localStorage.removeItem("cs2:local:day:" + k);
    ["col:mine:pantry", "col:mine:dishes", "me"].forEach(k => localStorage.removeItem("cs2:local:" + k));
  }
  Data.saveMe();
  startWatches();
  const code = me.family;
  if (code) { try { await connectFamily(code); } catch (e) { me.family = null; Data.saveMe(); stopRemote(); startWatches(); } }
  await loadDay(); await loadWeek(); render(); renderAccount();
  if (!me.family && joinCode) openFamily();
}
function signedOut() {
  stopRemote(); R.user = null; LS.ns = "local"; me = loadMe();
  startWatches(); loadDay().then(loadWeek); render(); renderAccount();
  openAuth("in");
}

async function connectFamily(code, { create = false, name = "" } = {}) {
  const ref = R.fs.collection("families").doc(code);
  if (create) await ref.set({ name: name || "Our family", created: Date.now(), by: me.pid });
  else { const s = await ref.get(); if (!s.exists) throw new Error("No family uses that code. Check it with the person who sent it."); }
  // Share the foods and dishes from your account with the family the first time you join.
  if (!LS.get("sharedInto:" + code, false)) {
    const u = userRef();
    try {
      const [p, d] = await Promise.all([u.collection("pantry").get(), u.collection("dishes").get()]);
      const jobs = [];
      p.forEach(doc => jobs.push(ref.collection("pantry").doc(doc.id).set(doc.data(), { merge: true })));
      d.forEach(doc => jobs.push(ref.collection("dishes").doc(doc.id).set(doc.data(), { merge: true })));
      await Promise.allSettled(jobs);
    } catch (e) {}
    LS.set("sharedInto:" + code, true);
  }
  stopRemote();
  R.fam = ref; me.family = code;
  Data.saveMe();
  startWatches();
  R.unsubs.push(ref.onSnapshot(s => { S.famInfo = s.exists ? s.data() : null; renderHeader(); }, () => {}));
  render();
}

/* =========================================================
   State
   ========================================================= */
const S = { date: new Date(), entries: [], week: {}, open: null, famInfo: null };
function startWatches() {
  Data.watch("pantry", m => { cache.pantry = m; });
  Data.watch("dishes", m => { cache.dishes = m; renderDishes(); });
  Data.watch("members", m => { cache.members = m; renderDishes(); const l = $("#memList"); if (l) l.innerHTML = memListHtml(); });
}
const memberName = pid => pid === me.pid ? "You" : (cache.members[pid]?.name || "Someone");
function foodById(id) { return COMMON_BY_ID[id] || (cache.pantry[id] ? { ...cache.pantry[id], id } : null); }
function foodId(f) { return f.id && !String(f.id).startsWith("tmp") ? f.id : f.code ? "bc-" + f.code : "nm-" + hash(norm(f.name + "|" + (f.brand || ""))); }
function remember(id) { me.recent = [id, ...me.recent.filter(x => x !== id)].slice(0, 40); Data.saveMe(); }

async function loadDay() { S.entries = await Data.getDay(dayKey(S.date)); S.week[dayKey(S.date)] = sum(S.entries).kcal; render(); }
async function loadWeek() {
  const keys = weekKeys();
  const vals = await Promise.all(keys.map(k => Data.getDay(k)));
  keys.forEach((k, i) => S.week[k] = sum(vals[i]).kcal);
  renderSummary();
}
function weekKeys() { const out = []; for (let i = 6; i >= 0; i--) { const d = new Date(S.date); d.setDate(d.getDate() - i); out.push(dayKey(d)); } return out; }
function saveDay() { const k = dayKey(S.date); Data.setDay(k, S.entries); S.week[k] = sum(S.entries).kcal; }
function sum(es) { return (es || []).reduce((t, e) => ({ kcal: t.kcal + (+e.kcal || 0), protein: t.protein + (+e.protein || 0), carbs: t.carbs + (+e.carbs || 0), fat: t.fat + (+e.fat || 0) }), { kcal: 0, protein: 0, carbs: 0, fat: 0 }); }
function addEntry(e) {
  const before = sum(S.entries).kcal;
  S.entries.push({ id: rid(10), at: Date.now(), ...e }); saveDay(); render();
  const after = before + (+e.kcal || 0), lim = me.goals.kcal;
  if (after > lim && before <= lim) toast(`Added ${fmt(e.kcal)} kcal. You're now ${fmt(after - lim)} kcal over your limit.`, true);
  else if (after > lim) toast(`Added ${fmt(e.kcal)} kcal. ${fmt(after - lim)} kcal over your limit.`, true);
  else toast(`Added ${fmt(e.kcal)} kcal to ${e.meal}. ${fmt(lim - after)} left.`);
}

/* =========================================================
   Render
   ========================================================= */
function renderHeader() {
  const fam = R.fam && S.famInfo;
  renderAccount();
  $("#dishTitle").textContent = fam ? `${S.famInfo.name} dishes` : "Dishes";
}
function renderSummary() {

  }).join("");
}

/* =========================================================
   Sheets
   ========================================================= */
let sheetBack = null, sheetCleanup = [];
function openSheet(html, back = null) {
  sheetCleanup.forEach(f => { try { f(); } catch (e) {} }); sheetCleanup = [];
  sheetBack = back;
  $("#sheetRoot").innerHTML = `<div class="shade" id="shade"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  const a = $("#sheetRoot [data-autofocus]"); if (a) setTimeout(() => a.focus(), 60);
  return $("#sheetRoot .sheet");
}
function closeSheet() { sheetCleanup.forEach(f => { try { f(); } catch (e) {} }); sheetCleanup = []; $("#sheetRoot").innerHTML = ""; sheetBack = null; }
function dismiss() { const b = sheetBack; if (b) b(); else closeSheet(); }
$("#sheetRoot").addEventListener("click", e => { if (e.target.id === "shade" || e.target.closest("[data-close]")) dismiss(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#shade")) dismiss(); });
const head = (title, back) => `<div class="sheet-h"><h3>${title}</h3><button class="iconbtn" data-close aria-label="${back ? "Back" : "Close"}">${back ? "‹" : "✕"}</button></div>`;
function chips(name, opts, sel) { return `<div class="chips" role="group" data-chips="${name}">${opts.map(([v, l]) => `<button class="chip" data-v="${esc(v)}" aria-pressed="${v === sel}">${esc(l)}</button>`).join("")}</div>`; }
function wireChips(root, name, onPick) {
  const g = root.querySelector(`[data-chips="${name}"]`); if (!g) return;
  g.querySelectorAll(".chip").forEach(b => b.onclick = () => { g.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x === b)); onPick(b.dataset.v); });
}
const mealChips = sel => chips("meal", MEALS.map(m => [m, m]), sel);

/* =========================================================
   Search: common foods + family pantry + dishes + Open Food Facts
   flow = { meal } when logging, or { pick(ingredient) } when building a dish
   ========================================================= */
function openSearch(flow) {
  const pick = !!flow.pick;
  const sh = openSheet(`${head(pick ? "Add ingredient" : "Search food", pick)}
    ${pick ? "" : mealChips(flow.meal)}
    <form id="sForm" role="search"><input id="sIn" type="search" placeholder="Search foods, brands, dishes" autocomplete="off" data-autofocus enterkeyhint="search"></form>
    <div class="tools">
      <button class="tool" id="tScan"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7V4h3M18 4h3v3M21 17v3h-3M6 20H3v-3"/><path d="M7 8v8M10 8v8M13 8v8M16 8v8" stroke-width="1.6"/></svg>Scan</button>
      <button class="tool" id="tManual"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>Enter manually</button>
      ${pick ? `<button class="tool" id="tCode"><span class="code" style="font-size:15px;color:var(--accent)">123</span>Type barcode</button>` : `<button class="tool" id="tDish"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 10h16v6a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z"/><path d="M2 10h20"/></svg>Create dish</button>`}
    </div>
    <div id="sRes" style="display:flex;flex-direction:column;gap:12px"></div>`, pick ? flow.back : null);
  if (!pick) wireChips(sh, "meal", m => flow.meal = m);
  const input = $("#sIn"), res = $("#sRes");
  let offState = { q: "", items: null, loading: false, err: "" }, items = {};
  const row = (f, right) => { items[f.id] = f; return `<button class="entry" data-pick="${esc(f.id)}"><span class="nm"><b>${esc(f.name)}</b><small>${esc([f.brand, f.servingLabel].filter(Boolean).join(" · "))}</small></span><span class="kc">${right}</span></button>`; };
  const kcalRight = f => `${fmt(f.kcal)}<small>kcal</small>`;
  function draw() {
    items = {};
    const q = norm(input.value.trim()), words = q.split(/\s+/).filter(Boolean);
    const hit = s => words.every(w => s.includes(w));
    let html = "";
    if (!q) {
      const rec = me.recent.map(foodById).filter(Boolean).slice(0, 12);
      html += rec.length ? `<div class="grp">Recent</div><div class="list">${rec.map(f => row(f, kcalRight(f))).join("")}</div>`
        : `<p class="note">Type a food like “chicken breast” or a brand. Results come from common foods, foods your family has added, and the Open Food Facts database.</p>`;
    } else {
      if (!pick) {
        const ds = Object.entries(cache.dishes).filter(([, d]) => hit(norm(d.name))).slice(0, 6);
        if (ds.length) html += `<div class="grp">Dishes</div><div class="list">${ds.map(([id, d]) => `<button class="entry" data-dishpick="${esc(id)}"><span class="nm"><b>${esc(d.name)}</b><small>${esc(memberName(d.by))} · ${d.portions || "?"} portions</small></span><span class="kc">${d.portions ? fmt(d.kcal / d.portions) : fmt(d.kcal)}<small>${d.portions ? "kcal/portion" : "kcal"}</small></span></button>`).join("")}</div>`;
      }
      const pan = Object.entries(cache.pantry).map(([id, f]) => ({ ...f, id })).filter(f => hit(norm(f.name + " " + (f.brand || "")))).slice(0, 15);
      if (pan.length) html += `<div class="grp">${R.fam ? "Family foods" : "Your foods"}</div><div class="list">${pan.map(f => row(f, kcalRight(f))).join("")}</div>`;
      const com = COMMON.filter(f => hit(f._n)).slice(0, 15);
      if (com.length) html += `<div class="grp">Common foods</div><div class="list">${com.map(f => row(f, kcalRight(f))).join("")}</div>`;
      html += `<div class="grp">Open Food Facts</div>`;
      if (offState.q === q && offState.items) {
        html += offState.items.length ? `<div class="list">${offState.items.map(f => row(f, kcalRight(f))).join("")}</div>` : `<p class="note">No products found for “${esc(input.value.trim())}”.</p>`;
      } else if (offState.loading) html += `<p class="note"><span class="spin"></span>&nbsp; Searching millions of products…</p>`;
      else html += `${offState.err ? `<p class="err">${esc(offState.err)}</p>` : ""}<button class="btn wide" id="offGo">Search packaged products for “${esc(input.value.trim())}”</button>`;
    }
    res.innerHTML = html;
    const go = $("#offGo"); if (go) go.onclick = runOff;
  }
  async function runOff() {
    const raw = input.value.trim(), q = norm(raw); if (!q) return;
    offState = { q, items: null, loading: true, err: "" }; draw();
    try { offState.items = await searchOFF(raw); }
    catch (e) { offState.err = e.message || "Search failed. Check your connection and try again."; }
    offState.loading = false; if (norm(input.value.trim()) === q) draw();
  }
  let t; input.oninput = () => { clearTimeout(t); t = setTimeout(draw, 120); };
  $("#sForm").onsubmit = e => { e.preventDefault(); input.blur(); runOff(); };
  draw();
  res.onclick = e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.pick) openFood({ ...items[b.dataset.pick] }, { ...flow, back: () => openSearch(flow) });
    else if (b.dataset.dishpick) openDish(b.dataset.dishpick, { meal: flow.meal });
  };
  $("#tScan").onclick = () => startScan(flow);
  $("#tManual").onclick = () => openFood(blankFood(input.value.trim()), { ...flow, back: () => openSearch(flow) });
  if ($("#tDish")) $("#tDish").onclick = () => openDishEditor();
  if ($("#tCode")) $("#tCode").onclick = () => openCodeEntry(flow);
}

let offTimes = [];
async function searchOFF(q) {
  offTimes = offTimes.filter(x => Date.now() - x < 60000);
  if (offTimes.length >= 9) throw new Error("Open Food Facts allows about 10 searches a minute. Wait a moment and try again.");
  offTimes.push(Date.now());
  const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 12000);
  try {
    const u = `https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=25&sort_by=unique_scans_n&fields=code,product_name,product_name_en,product_name_es,brands,nutriments,serving_size,serving_quantity`;
    const r = await fetch(u, { signal: ctl.signal });
    if (!r.ok) throw new Error(r.status === 429 || r.status === 503 ? "Open Food Facts is busy. Try again in a minute." : "Search failed. Try again.");
    const j = await r.json();
    return (j.products || []).map(offToFood).filter(Boolean);
  } catch (e) {
    if (e.name === "AbortError") throw new Error("Open Food Facts took too long to answer. Try again.");
    if (e instanceof TypeError) throw new Error("Couldn't reach Open Food Facts. Check your connection.");
    throw e;
  } finally { clearTimeout(tm); }
}
function offToFood(p) {
  const n = p.nutriments || {};
  let k100 = n["energy-kcal_100g"]; if (k100 == null && n["energy_100g"] != null) k100 = n["energy_100g"] / 4.184;
  const name = p.product_name || p.product_name_en || p.product_name_es;
  if (k100 == null || !name) return null;
  const sq = parseFloat(p.serving_quantity), g = sq > 0 ? sq : 100, f = g / 100;
  return { id: "bc-" + p.code, src: "off", code: String(p.code || ""), name, brand: (p.brands || "").split(",")[0].trim(),
    servingLabel: sq > 0 ? (p.serving_size || `${sq} g`) : "100 g", servingGrams: g,
    kcal: Math.round(k100 * f), protein: r1((n.proteins_100g || 0) * f), carbs: r1((n.carbohydrates_100g || 0) * f), fat: r1((n.fat_100g || 0) * f) };
}
async function fetchProduct(code) {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 9000);
  try {
    const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=code,product_name,product_name_en,product_name_es,brands,nutriments,serving_size,serving_quantity`, { signal: ctl.signal });
    if (!r.ok) return null;
    const j = await r.json(); if (j.status !== 1 || !j.product) return null;
    return offToFood({ ...j.product, code });
  } catch (e) { return null; } finally { clearTimeout(t); }
}
function blankFood(name = "") { return { id: "tmp-" + rid(6), src: "manual", code: "", name, brand: "", servingLabel: "1 serving", servingGrams: null, kcal: "", protein: "", carbs: "", fat: "" }; }

/* =========================================================
   Food sheet: nutrition label + how much (grams or servings)
   ========================================================= */
function openFood(food, flow) {
  const pick = !!flow.pick;
  let meal = flow.meal || mealForNow();

  const startAmt = unit === "g" ? food.servingGrams : 1;
  const sh = openSheet(`${head(flow.unknown ? "New product" : pick ? "Add ingredient" : "Log food", !!flow.back)}
    ${flow.unknown ? `<div class="banner"><span>Barcode <span class="code">${esc(food.code)}</span> isn't in Open Food Facts yet. Type the numbers from the nutrition panel once and it's saved for ${R.fam ? "the whole family" : "next time"}.</span></div>` : ""}
    ${food.src === "off" ? `<p class="note">From Open Food Facts. Check against the pack if something looks off.</p>` : food.src === "db" ? `<p class="note">Typical values. Edit them to match your pack if you have it.</p>` : ""}
    <div class="label">
      <div class="title">Nutrition Facts</div>

      <div class="rule-xl"></div>
      <div class="serv"><span class="sub">Serving</span>
        <input class="sz" id="fServ" type="text" value="${esc(food.servingLabel)}" aria-label="Serving description">
        <input class="gr" id="fGrams" type="number" inputmode="decimal" min="0" step="any" placeholder="?" value="${food.servingGrams ?? ""}" aria-label="Grams per serving"><span class="sub">g</span></div>
      <div class="rule-m"></div>
      <div class="sub">Amount per serving</div>
      <div class="ln cal first"><span class="k">Calories</span><input id="fK" type="number" inputmode="decimal" min="0" step="any" value="${food.kcal}" aria-label="Calories per serving"></div>
      <div class="rule-m" style="margin:2px 0"></div>
      <div class="ln first"><span class="k"><span class="dot" style="background:var(--protein)"></span>Protein (g)</span><input id="fP" type="number" inputmode="decimal" min="0" step="any" value="${food.protein}" aria-label="Protein grams"></div>
      <div class="ln"><span class="k"><span class="dot" style="background:var(--carbs)"></span>Carbohydrate (g)</span><input id="fC" type="number" inputmode="decimal" min="0" step="any" value="${food.carbs}" aria-label="Carbohydrate grams"></div>
      <div class="ln"><span class="k"><span class="dot" style="background:var(--fat)"></span>Total fat (g)</span><input id="fF" type="number" inputmode="decimal" min="0" step="any" value="${food.fat}" aria-label="Fat grams"></div>
    </div>
    <div class="field"><span class="lbl">How much ${pick ? "goes in the dish" : "did you eat"}</span>
      <div class="amount"><input id="fAmt" type="number" inputmode="decimal" min="0" step="any" value="${startAmt}" aria-label="Amount">${chips("unit", [["g", "grams"], ["serv", "servings"]], unit)}</div>
      <p class="note" id="fUnitHint" hidden>Enter the grams per serving on the label above to log by weight.</p>
    </div>
    ${pick ? "" : mealChips(meal)}
    <div class="total"><span class="big" id="fTot">0 kcal</span><span class="mac" id="fMac"></span></div>
    <p class="err" id="fErr" hidden></p>
    <button class="btn primary wide" id="fAdd">${pick ? "Add to dish" : "Add to " + meal}</button>`, flow.back || null);
  if (!pick) wireChips(sh, "meal", m => { meal = m; $("#fAdd").textContent = "Add to " + m; });
  wireChips(sh, "unit", u => {
    const g = num("fGrams"), amt = num("fAmt") || 0;
    if (u === "g" && !(g > 0)) { $("#fUnitHint").hidden = false; setUnit(unit); return; }
    // convert the typed amount so the total stays the same
    if (u !== unit && g > 0) $("#fAmt").value = u === "g" ? r1(amt * g) : r1(amt / g);
    unit = u; $("#fUnitHint").hidden = true; calc();
  });
  function setUnit(u) { sh.querySelectorAll('[data-chips="unit"] .chip').forEach(x => x.setAttribute("aria-pressed", x.dataset.v === u)); }
  const num = id => { const x = parseFloat($("#" + id).value); return isNaN(x) ? null : x; };
  function calc() {
    const amt = num("fAmt") || 0, g = num("fGrams");
    const mult = unit === "g" ? (g > 0 ? amt / g : 0) : amt;
    const t = { kcal: (num("fK") || 0) * mult, protein: (num("fP") || 0) * mult, carbs: (num("fC") || 0) * mult, fat: (num("fF") || 0) * mult };
    $("#fTot").textContent = fmt(t.kcal) + " kcal";
    $("#fMac").textContent = `P ${r1(t.protein)} · C ${r1(t.carbs)} · F ${r1(t.fat)} g`;
    return { t, amt, mult, g };
  }
  sh.addEventListener("input", calc); calc();
  $("#fAdd").onclick = () => {
    const err = m => { $("#fErr").textContent = m; $("#fErr").hidden = false; };
    const f = { ...food, name: $("#fName").value.trim(), brand: $("#fBrand").value.trim(), servingLabel: $("#fServ").value.trim() || "1 serving",
      servingGrams: num("fGrams") || null, kcal: num("fK"), protein: num("fP") || 0, carbs: num("fC") || 0, fat: num("fF") || 0 };
    if (!f.name) return err("Give the food a name.");

    const { t, amt, g } = calc();
    if (!(amt > 0)) return err("Enter how much.");
    const edited = food.src === "db" && ["kcal", "protein", "carbs", "fat", "servingGrams", "name"].some(k => String(f[k] ?? "") !== String(food[k] ?? ""));

function normCode(s) { let c = String(s || "").replace(/\D/g, ""); if (c.length === 12) c = "0" + c; return c; }

let scanFlow = null;
async function startScan(flow) {
  scanFlow = flow;

  const sh = openSheet(`${head("Scan a barcode", !!back)}
    <div class="finder"><video id="vid" playsinline muted autoplay></video><div class="frame"></div><div class="laser"></div></div>
    <p class="note" id="camMsg">Starting the camera…</p>
    <div class="row"><button class="btn" id="usePhoto">Take a photo instead</button><button class="btn" id="typeCode">Type the number</button></div>`, back);
  $("#usePhoto").onclick = () => { const f = $("#photoFile"); f.value = ""; f.click(); };
  $("#typeCode").onclick = () => openCodeEntry(flow);
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { $("#camMsg").textContent = "This browser can't use the camera here. Take a photo instead."; return; }
  let stream, stopped = false, frame = 0;
  const stop = () => { stopped = true; if (stream) stream.getTracks().forEach(t => t.stop()); };
  sheetCleanup.push(stop);
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
  } catch (e) {
    $("#camMsg").textContent = e && e.name === "NotAllowedError" ? "Camera access was blocked. Allow it in Settings › Safari › Camera (or for this app), or take a photo instead." : "Couldn't start the camera. Take a photo instead.";

  }
  if (stopped) { stream.getTracks().forEach(t => t.stop()); return; }
  const v = $("#vid"); v.srcObject = stream;
  try { await v.play(); } catch (e) {}
  $("#camMsg").textContent = "Line the barcode up inside the box. Hold steady about 15 cm away.";
  const c = document.createElement("canvas"), ctx = c.getContext("2d", { willReadFrequently: true });

        const sc = Math.min(1, 900 / cw), w = Math.round(cw * sc), h = Math.round(ch * sc);

}

  let code = null; try { code = await decodePhoto(file); } catch (err) {}

async function decodePhoto(file) {

}

      if (create) {
        const cred = await firebase.auth().createUserWithEmailAndPassword(email, pass);
        try { await cred.user.updateProfile({ displayName: name }); } catch (x) {}
        me.name = name; LS.set("me", me);
      } else await firebase.auth().signInWithEmailAndPassword(email, pass);
      LS.set("skipAuth", false, true);
      // onAuthStateChanged takes it from here
    } catch (x) {
      go.disabled = false; go.textContent = create ? "Create account" : "Sign in";
      err(AUTH_ERR[x.code] || x.message || "That didn't work. Try again.");
    }
  };
  if ($("#aReset")) $("#aReset").onclick = async () => {
    const email = $("#aEmail").value.trim(); if (!email) return err("Enter your email above first, then tap this again.");
    try { await firebase.auth().sendPasswordResetEmail(email); toast("Reset link sent. Check your email."); }
    catch (x) { err(AUTH_ERR[x.code] || "Couldn't send the reset email. Check the address."); }
  };
  if (!R.user) sheetBack = () => { LS.set("skipAuth", true, true); closeSheet(); };
}

/* =========================================================
   Family
   ========================================================= */
function inviteLink(code) { const u = new URL(location.href); u.search = ""; u.hash = ""; u.searchParams.set("family", code); return u.href; }
function copyBtn(id, text) {
  const b = $("#" + id); if (!b) return;
  b.onclick = async () => {
    try { await navigator.clipboard.writeText(text); toast("Copied"); }
    catch (e) { const r = document.createRange(), el = b.previousElementSibling; if (el) { r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } toast("Select and copy the text above", true); }
  };
}
function accountRow() {
  return `<div class="banner" style="flex-direction:row;align-items:center;border-style:solid"><span style="flex:1;min-width:0"><b>${esc(me.name || "Signed in")}</b><br><span class="note" style="word-break:break-all">${esc(R.user.email || "")}</span></span><button class="btn small" id="signOut" style="flex:none">Sign out</button></div>`;
}
function wireSignOut() {
  let armed = false;
  const b = $("#signOut"); if (!b) return;
  b.onclick = async () => {
    if (!armed) { armed = true; b.textContent = "Tap to confirm"; return; }
    closeSheet(); await firebase.auth().signOut(); toast("Signed out");
  };
}
function memListHtml() {
  const members = Object.entries(cache.members).sort((a, b) => (a[1].joined || 0) - (b[1].joined || 0));
  return members.map(([pid, m]) => `<div class="entry"><span class="nm"><b>${esc(pid === me.pid ? (m.name || "You") + " (you)" : m.name || "Someone")}</b></span></div>`).join("") || `<p class="empty" style="padding:12px 14px">Just you so far.</p>`;
}
function openFamily() {
  if (!window.FIREBASE_CONFIG) {
    openSheet(`${head("Family & accounts")}<p>Accounts and family sharing aren't switched on for this website yet. Until they are, this device keeps its own diary, foods and dishes.</p>
      <p class="note">Whoever set up the site turns them on by creating a free Firebase project and pasting its settings into <span class="code">config.js</span>. The steps are in the README that came with the app.</p>`);
    return;
  }
  if (!R.fs) {
    openSheet(`${head("Family & accounts")}<p class="err">Couldn't connect to your account${R.err ? `: ${esc(R.err)}` : ""}.</p><p class="note">Check your connection and reopen the app.</p>`);
    return;
  }
  if (!R.user) {
    openSheet(`${head("Family & accounts")}
      <p>Sign in to keep your diary on every device and share dishes with your family. Everyone keeps their own diary and limit, and logs their own portion of shared dishes.</p>
      ${joinCode ? `<div class="banner">You've been invited to a family. Sign in or create an account to join.</div>` : ""}
      <div class="row"><button class="btn primary" id="toUp">Create account</button><button class="btn" id="toIn">Sign in</button></div>`);
    $("#toUp").onclick = () => openAuth("up"); $("#toIn").onclick = () => openAuth("in");
    return;
  }
  if (!R.fam) {
    const sh = openSheet(`${head("Family")}
      ${accountRow()}
      <p>Share dishes and foods with your family. Everyone keeps their own private diary and limit, and logs their own portion of shared dishes.</p>
      ${joinCode ? `<div class="grp">You've been invited</div>
        <div class="row"><div class="field"><label for="jc">Family code</label><input id="jc" type="text" class="code" autocapitalize="none" autocomplete="off" value="${esc(joinCode)}"></div><button class="btn primary" id="jn" style="flex:none">Join</button></div>` : `
      <div class="grp">Start a family</div>
      <div class="row"><div class="field"><label for="fn">Family name</label><input id="fn" type="text" placeholder="The Rehns"></div><button class="btn primary" id="mk" style="flex:none">Create</button></div>
      <div class="grp">Or join one</div>
      <div class="row"><div class="field"><label for="jc">Family code</label><input id="jc" type="text" class="code" autocapitalize="none" autocomplete="off" placeholder="from the invite"></div><button class="btn" id="jn" style="flex:none">Join</button></div>`}
      <p class="err" id="famErr" hidden></p>`);
    wireSignOut();
    const go = async (create) => {
      const err = m => { $("#famErr").textContent = m; $("#famErr").hidden = false; };
      const code = create ? rid(10) : $("#jc").value.replace(/[^a-z0-9]/gi, "").toLowerCase();
      if (!create && code.length < 6) return err("Enter the family code from the invite.");
      try {
        sh.querySelectorAll("button").forEach(b => b.disabled = true);
        await connectFamily(code, { create, name: create ? $("#fn").value.trim() : "" });
        await loadDay(); openFamily(); toast(create ? "Family created" : "You've joined the family");
      } catch (e) { sh.querySelectorAll("button").forEach(b => b.disabled = false); err(e.message || "Couldn't connect. Try again."); }
    };
    if ($("#mk")) $("#mk").onclick = () => go(true);
    $("#jn").onclick = () => go(false);
    return;
  }
  openSheet(`${head(esc(S.famInfo?.name || "Family"))}
    ${accountRow()}
    <div class="field"><label for="fnm">Family name</label><input id="fnm" type="text" value="${esc(S.famInfo?.name || "")}"></div>
    <div class="field"><label for="myName2">Your name</label><input id="myName2" type="text" value="${esc(me.name)}"></div>
    <div class="grp">Members</div>
    <div class="list" id="memList">${memListHtml()}</div>
    <div class="grp">Invite someone</div>
    <p class="note">Send them this link. They open it in Safari, add it to their Home Screen, create an account and join. Or they can type the code in the Family screen.</p>
    <div class="banner"><span class="code" style="word-break:break-all;user-select:all">${esc(inviteLink(me.family))}</span><button class="btn small" id="cpLink" style="align-self:flex-start">Copy invite link</button></div>
    <div class="bigcode">${esc(me.family)}</div>
    <button class="btn primary wide" id="famSave">Save names</button>
    <button class="btn ghost small danger" id="leave">Leave this family</button>`);
  copyBtn("cpLink", inviteLink(me.family)); wireSignOut();
  $("#famSave").onclick = () => {
    const fn = $("#fnm").value.trim(), mn = $("#myName2").value.trim();
    if (fn && fn !== S.famInfo?.name) R.fam.set({ name: fn }, { merge: true }).catch(remoteFail);
    if (mn) { me.name = mn; Data.saveMe(); renderAccount(); }
    closeSheet(); toast("Saved");
  };
  let armed = false;
  $("#leave").onclick = () => {
    if (!armed) { armed = true; $("#leave").textContent = "Tap again to leave. Your diary stays in your account."; return; }
    if (R.fam) R.fam.collection("members").doc(me.pid).delete().catch(() => {});
    stopRemote(); me.family = null; Data.saveMe(); startWatches(); closeSheet(); render(); renderAccount(); toast("You've left the family");
  };
}

/* =========================================================
   Install hint (iPhone/iPad Safari, not yet on the Home Screen)
   ========================================================= */
const standalone = window.navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
const ios = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
if (ios && !standalone && !LS.get("installTipX", false, true)) $("#installTip").hidden = false;
$("#installX").onclick = () => { $("#installTip").hidden = true; LS.set("installTipX", true, true); };
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});

/* =========================================================
   Boot
   ========================================================= */
startWatches();
render();
loadDay().then(loadWeek);
(async () => {
  const note = $("#storeNote");
  const ok = await initRemote();
  if (!ok) { note.textContent = window.FIREBASE_CONFIG ? "Couldn't reach your account, so this device is saving on its own for now." : "Your diary is saved on this device."; renderAccount(); return; }
  renderAccount();
  let first = true;
  firebase.auth().onAuthStateChanged(async user => {
    const wasFirst = first; first = false;
    if (user) {
      if (R.user && R.user.uid === user.uid) return;
      note.textContent = "Loading your account…";
      await signedIn(user);
      note.textContent = R.fam ? `Signed in as ${user.email}. Sharing with ${S.famInfo?.name || "your family"}.` : `Signed in as ${user.email}. Your diary syncs to every device you sign in on.`;
    } else {
      if (R.user) signedOut();
      note.textContent = "Saved on this device only. Sign in to keep it on all your devices.";
      renderAccount();
      if (wasFirst && (!LS.get("skipAuth", false, true) || joinCode)) openAuth(joinCode || !LS.get("everSignedIn", false, true) ? "up" : "in");
    }
  });
})();
})();
</script>
</body>
</html>
